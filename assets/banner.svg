<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#09101d"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176fc"/>
      <stop offset="100%" stop-color="#e0c3fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d48" stroke-width="0.8" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3"/>
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .highlight-cyan {
        fill: #00f2fe;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }

      /* Dynamic Animations (Background Only) */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.08); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-25px, 25px) scale(0.95); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseBeam {
        0% { opacity: 0.2; stroke-dashoffset: 200; }
        50% { opacity: 0.7; }
        100% { opacity: 0.2; stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pillGlow {
        0% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
        100% { stroke-opacity: 0.3; }
      }

      .orb1 { animation: floatSlow1 12s ease-in-out infinite; transform-origin: 200px 150px; }
      .orb2 { animation: floatSlow2 15s ease-in-out infinite; transform-origin: 1000px 250px; }
      .beam-pulse {
        stroke-dasharray: 40 80;
        animation: pulseBeam 6s linear infinite;
      }
      .radar-sweep {
        animation: radarSweep 10s linear infinite;
        transform-origin: 1020px 180px;
      }
      .animated-pill {
        animation: pillGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb1">
    <circle cx="200" cy="120" r="120" fill="#00f2fe" opacity="0.12" filter="url(#glowOrb)"/>
  </g>
  <g class="orb2">
    <circle cx="1020" cy="220" r="140" fill="#7000ff" opacity="0.15" filter="url(#glowOrb)"/>
  </g>

  <!-- Grid Layer -->
  <rect width="1200" height="400" fill="url(#cyberGrid)"/>

  <!-- Dynamic Flow Rays / Ambient Data Streams (Background) -->
  <g opacity="0.6">
    <path class="beam-pulse" d="M 0 320 Q 300 240 600 320 T 1200 320" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <path class="beam-pulse" d="M 0 350 Q 400 380 800 340 T 1200 360" fill="none" stroke="#7000ff" stroke-width="1.5" style="animation-duration: 9s;"/>
    <path class="beam-pulse" d="M 0 80 Q 450 140 900 60 T 1200 90" fill="none" stroke="#38bdf8" stroke-width="1" style="animation-duration: 7s;"/>
  </g>

  <!-- Decorative Right Side: Security Radar / Contract Vault Graphic -->
  <g transform="translate(1020, 190)">
    <!-- Concentric radar / security rings -->
    <circle cx="0" cy="0" r="100" fill="url(#shieldGrad)" stroke="#1e293b" stroke-width="2"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="0" cy="0" r="25" fill="#0c1527" stroke="#00f2fe" stroke-width="1.5"/>

    <!-- Radar Sweep Effect -->
    <line class="radar-sweep" x1="0" y1="0" x2="95" y2="0" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Shield & Key Icon in Center -->
    <path d="M 0 -12 L 10 -7 L 10 3 C 10 9 0 14 0 14 C 0 14 -10 9 -10 3 L -10 -7 Z" fill="#00f2fe" opacity="0.8"/>
    <circle cx="0" cy="-2" r="3" fill="#070b14"/>

    <!-- Node Points with Connectors -->
    <circle cx="-65" cy="-45" r="5" fill="#00f2fe" filter="url(#glowCyan)"/>
    <circle cx="70" cy="-35" r="4" fill="#a855f7"/>
    <circle cx="55" cy="60" r="5" fill="#38bdf8"/>
    <circle cx="-50" cy="65" r="4" fill="#00f2fe"/>
    <line x1="-65" y1="-45" x2="-25" y2="-15" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="70" y1="-35" x2="25" y2="-10" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="55" y1="60" x2="18" y2="20" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Foreground Content: Unobstructed & Crisp -->
  <!-- Top Super-header / Category Tag -->
  <g transform="translate(80, 75)">
    <rect class="animated-pill" x="0" y="0" width="280" height="30" rx="15" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" opacity="0.95"/>
    <circle cx="16" cy="15" r="5" fill="#00f2fe" filter="url(#glowCyan)"/>
    <text x="32" y="20" class="badge-text" fill="#38bdf8" font-size="12">CONTRACT DATA SECURITY &amp; GRC</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="150" class="title-text">
    Awesome Contract Data Security
  </text>
  <text x="80" y="195" class="title-text">
    &amp; <tspan class="highlight-cyan">&amp; Information Governance</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="240" class="subtitle-text">
    Curated enterprise SaaS intelligence &amp; production-grade open-source tools for
  </text>
  <text x="80" y="265" class="subtitle-text">
    sensitive document discovery, contract classification, PII redaction, and compliance.
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(80, 305)">
    <!-- Pill 1: Sensitive Data Discovery -->
    <g transform="translate(0, 0)">
      <rect class="animated-pill" width="190" height="36" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#00f2fe"/>
      <text x="32" y="23" class="badge-text">Data Discovery &amp; DSPM</text>
    </g>

    <!-- Pill 2: Contract Classification -->
    <g transform="translate(205, 0)">
      <rect class="animated-pill" width="185" height="36" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#a855f7"/>
      <text x="32" y="23" class="badge-text">PII &amp; Secret Redaction</text>
    </g>

    <!-- Pill 3: Automated Compliance -->
    <g transform="translate(405, 0)">
      <rect class="animated-pill" width="200" height="36" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#38bdf8"/>
      <text x="32" y="23" class="badge-text">SOC 2 / GDPR Compliance</text>
    </g>

    <!-- Pill 4: Open-Source First -->
    <g transform="translate(620, 0)">
      <rect class="animated-pill" width="180" height="36" rx="10" fill="#111c33" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="18" r="4" fill="#4facfe"/>
      <text x="32" y="23" class="badge-text">Open-Source &amp; SaaS</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="398" x2="1200" y2="398" stroke="url(#blueCyan)" stroke-width="3" opacity="0.8"/>
</svg>
